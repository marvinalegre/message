<main class="container">
  <h1>Sign up</h1>

  <form method="POST" class="auth-form">
    <label>
      Username
      <input name="username" required />
    </label>

    <label>
      Password
      <input name="password" type="password" required />
    </label>

    <button>Sign up</button>
  </form>

  <p>
    Already have an account?
    <a href="/login">Log in</a>
  </p>
</main>
